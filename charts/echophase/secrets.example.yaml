# Copy to secrets.yaml (gitignored) and set real values:
#   cp helm/secrets.example.yaml helm/secrets.yaml
# `mise run helm:install` / `helm:upgrade` / `helm:template` pass it when it exists;
# by hand: helm upgrade --install echophase helm -f helm/secrets.yaml ...
#
# Postgres takes its password only when the data volume is first initialised:
# changing it later needs ALTER USER inside the database as well.
#
# For a real cluster prefer Sealed Secrets or External Secrets over a file.

secrets:
  POSTGRES_USER: echophase
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: echophase

  VALKEY_PASSWORD: "CHANGE_ME"

  SCYLLA_USERNAME: echophase
  SCYLLA_PASSWORD: ""
