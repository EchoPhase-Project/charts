# Copy to secrets.yaml (gitignored) and set real values, then pass it to Helm:
#   helm install echophase oci://ghcr.io/echophase-project/charts/echophase \
#     --version <version> -f secrets.yaml
#
# Postgres takes its password only when the data volume is first initialised:
# changing it later needs ALTER USER inside the database as well.
#
# For a real cluster prefer Sealed Secrets or External Secrets over a file.

secrets:
  POSTGRES_USER: echophase
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_DB: echophase

  VALKEY_PASSWORD: "CHANGE_ME"

  # Empty: the chart runs Scylla without authentication (the server refuses

  # a username without a password).

  SCYLLA_USERNAME: ""
  SCYLLA_PASSWORD: ""
