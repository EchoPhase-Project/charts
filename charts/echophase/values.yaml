# Global settings
global:
  imagePullPolicy: IfNotPresent
  storageClass: ""

# Registry configuration
# Where the server and webapp images come from (self-hosting: the published ones).
imageRegistry: ghcr.io/echophase-project

# EchoPhase Backend
echophase:
  image:
    repository: server
    # Empty: the chart's appVersion.
    tag: ""
    # Empty: Always for "latest", IfNotPresent for other (immutable) tags.
    pullPolicy: ""

  replicas: 1

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      # The app (~250 MiB) plus Argon2:MaxConcurrentHashes (2) password hashes in
      # flight, 64 MiB each (RFC 9106: Argon2id 64 MiB x 3, 4 lanes), and the GC's
      # slack for their buffers. Keep MaxConcurrentHashes at the CPU limit.
      memory: "1Gi"
      # A hash takes ~0.6 s on one core; two cores run two at once (MaxConcurrentHashes).
      cpu: "2"

  healthcheck:
    enabled: true
    # Liveness: the process answers.
    path: /health/live
    # Readiness: warm-up has finished, so the first request is not a cold start.
    readinessPath: /health/ready
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 5

  logs:
    enabled: true
    size: 1Gi

  # Environment variables
  env:
    ASPNETCORE_ENVIRONMENT: Production
    POSTGRES_HOST: "{{ .Release.Name }}-postgres"
    POSTGRES_PORT: "5432"
    SCYLLA_CLUSTER_NAME: echophase
    SCYLLA_CONTACT_POINT: "{{ .Release.Name }}-scylla"
    SCYLLA_SEEDS: "{{ .Release.Name }}-scylla"
    SCYLLA_AUTO_BOOTSTRAP: "1"
    SCYLLA_KEYSPACE: echophase
    VALKEY_HOST: "{{ .Release.Name }}-valkey"
    VALKEY_PORT: "6379"

  # More environment variables of the server (not secrets: they go into a
  # ConfigMap), e.g. where OpenTelemetry sends traces and metrics:
  #   OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  #   OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo.monitoring:4318/v1/traces
  # Values are templates ("{{ .Release.Name }}").
  extraEnv: {}

# EchoPhase webapp (SolidJS + nginx)
webapp:
  image:
    repository: webapp
    # Empty: the chart's appVersion.
    tag: ""
    # Empty: Always for "latest", IfNotPresent for other (immutable) tags.
    pullPolicy: ""

  replicas: 1

  # More environment variables of the webapp's nginx (not secrets), e.g. where
  # browser errors go (see the webapp's README):
  #   SENTRY_DSN: http://<key>@glitchtip.monitoring.svc/2
  #   ERRORS_UPSTREAM: glitchtip.monitoring.svc.cluster.local:80
  #   ERRORS_PROJECT: "2"
  # Values are templates ("{{ .Release.Name }}").
  extraEnv: {}

  service:
    type: LoadBalancer
    port: 80
    targetPort: 80

  ingress:
    enabled: true
    # *.localhost resolves to 127.0.0.1 in browsers without /etc/hosts entries.
    host: echophase.localhost
    tls: false
    # IngressClass to use; empty uses the cluster default.
    className: ""
    # Which ingress controller serves this Ingress: "nginx" (ingress-nginx) or
    # "traefik" (k3s default). Decides how rate limits are expressed.
    controller: nginx
    # Extra annotations, merged with the generated ones.
    annotations: {}
    # Coarse per-client-IP limits for the whole site, static files included.
    # Exact per-user limits are enforced by the API; nginx in the webapp pod adds
    # per-endpoint limits in between.
    rateLimit:
      enabled: true
      # Sustained requests per second per IP.
      rps: 20
      # Allowed burst = rps * burstMultiplier (a page load fetches many assets).
      burstMultiplier: 5
      # Concurrent connections per IP (ingress-nginx only).
      connections: 50

  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# EF migrations: an init container of the server pods (runs on every start)
migrate:
  enabled: true
  image:
    repository: server
    # Empty: the chart's appVersion.
    tag: ""
    # Empty: Always for "latest", IfNotPresent for other (immutable) tags.
    pullPolicy: ""

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# PostgreSQL
postgres:
  enabled: true
  # false: no Postgres in the release; the server connects to external.host
  # instead (a managed or shared PostgreSQL). Its user, password and database
  # are secrets.POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB; the database
  # must exist, the server creates its tables (migrations).
  external:
    host: ""
    port: 5432
  image:
    repository: postgres
    tag: "17"

  service:
    type: ClusterIP
    port: 5432

  persistence:
    enabled: true
    size: 10Gi

  auth:
    username: echophase
    database: echophase

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  healthcheck:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 5

# Valkey (Redis)
valkey:
  enabled: true
  # false: no Valkey in the release; the server connects to external.host
  # (Valkey or Redis), with secrets.VALKEY_PASSWORD.
  external:
    host: ""
    port: 6379
    # TLS to the server (managed Redis services often require it).
    ssl: false
  image:
    repository: valkey/valkey
    tag: latest

  service:
    type: ClusterIP
    port: 6379

  persistence:
    enabled: true
    size: 5Gi

  auth:

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  healthcheck:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 5

# ScyllaDB
scylla:
  enabled: true
  # false: no Scylla in the release; the server connects to an external
  # ScyllaDB (or Cassandra) cluster, with secrets.SCYLLA_USERNAME and
  # SCYLLA_PASSWORD if it requires authentication. On a real cluster, set
  # autoCreateKeyspace: false and create the keyspace with the replication you
  # want.
  external:
    # Comma-separated nodes; the driver discovers the rest.
    contactPoints: ""
    port: 9042
    # The datacenter of the nodes nearest to the server (multi-DC clusters).
    localDatacenter: ""
  image:
    repository: scylladb/scylla
    tag: latest

  service:
    type: ClusterIP
    port: 9042

  persistence:
    enabled: true
    size: 20Gi

  auth:
    username: echophase

  clusterName: echophase
  keyspace: echophase
  # Let the app create the keyspace (NetworkTopologyStrategy) on first connect.
  # Only for this single-node deployment; use a migration for real clusters.
  autoCreateKeyspace: true
  autoBootstrap: 1

  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

  healthcheck:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5

# Network
networkPolicy:
  enabled: false

# Credentials, rendered into the <release>-secrets Secret. Passwords have no
# defaults: put them in a values file of your own (copy secrets.example.yaml
# to secrets.yaml, which is gitignored, and pass it with -f) or a secret
# manager.
secrets:
  POSTGRES_USER: echophase
  POSTGRES_DB: echophase
  # POSTGRES_PASSWORD: required
  # VALKEY_PASSWORD: required
  # Empty: the chart runs Scylla without authentication (the server refuses
  # a username without a password).
  SCYLLA_USERNAME: ""
  # Scylla runs without authentication here, so this may stay empty.
  SCYLLA_PASSWORD: ""
