apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "echophase.fullname" . }}-config
  labels:
    {{- include "echophase.labels" . | nindent 4 }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.echophase.env.ASPNETCORE_ENVIRONMENT | quote }}
  
  # PostgreSQL
  POSTGRES_HOST: {{ include "echophase.postgresHost" . | quote }}
  POSTGRES_PORT: {{ include "echophase.postgresPort" . | quote }}
  {{- with include "echophase.postgresSslMode" . }}
  POSTGRES_SSL_MODE: {{ . | quote }}
  {{- end }}
  {{- if include "echophase.postgresCa" . }}
  POSTGRES_SSL_ROOT_CERT: {{ include "echophase.postgresCaPath" . | quote }}
  {{- end }}
  
  # Valkey
  VALKEY_HOST: {{ include "echophase.valkeyHost" . | quote }}
  VALKEY_PORT: {{ include "echophase.valkeyPort" . | quote }}
  VALKEY_SSL: {{ include "echophase.valkeySsl" . | quote }}
  
  # ScyllaDB
  SCYLLA_CLUSTER_NAME: {{ .Values.scylla.clusterName | quote }}
  SCYLLA_CONTACT_POINT: {{ include "echophase.scyllaContactPoints" . | quote }}
  Database__Scylla__Port: {{ include "echophase.scyllaPort" . | quote }}
  {{- with (and (not .Values.scylla.enabled) .Values.scylla.external.localDatacenter) }}
  SCYLLA_LOCAL_DC: {{ . | quote }}
  {{- end }}
  SCYLLA_SEEDS: {{ printf "%s-scylla" (include "echophase.fullname" .) | quote }}
  SCYLLA_AUTO_BOOTSTRAP: {{ .Values.scylla.autoBootstrap | quote }}
  SCYLLA_KEYSPACE: {{ .Values.scylla.keyspace | quote }}
  # The chart deploys a single-node Scylla, so the app may create its keyspace.
  SCYLLA_AUTO_CREATE_KEYSPACE: {{ .Values.scylla.autoCreateKeyspace | quote }}
  {{- with .Values.echophase.extraEnv }}

  # echophase.extraEnv
  {{- range $name, $value := . }}
  {{ $name }}: {{ tpl (toString $value) $ | quote }}
  {{- end }}
  {{- end }}
