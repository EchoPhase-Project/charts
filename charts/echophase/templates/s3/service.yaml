{{- if .Values.s3.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "echophase.fullname" . }}-s3
  labels:
    {{- include "echophase.labels" . | nindent 4 }}
    app.kubernetes.io/component: s3
spec:
  type: {{ .Values.s3.service.type }}
  ports:
  - port: {{ .Values.s3.service.port }}
    targetPort: s3
    protocol: TCP
    name: s3
  selector:
    {{- include "echophase.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: s3
{{- end }}
