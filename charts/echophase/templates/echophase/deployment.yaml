apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "echophase.fullname" . }}-server
  labels:
    {{- include "echophase.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.echophase.replicas }}
  selector:
    matchLabels:
      {{- include "echophase.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "echophase.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        # Roll the pods when their environment changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      # Each pod waits for the databases, then applies EF migrations, then
      # starts the server: no Helm hooks needed for the order. Concurrent pods
      # are safe, EF takes a database lock while migrating.
      initContainers:
      - name: wait-for-postgres
        image: postgres:16-alpine
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for postgres at {{ include "echophase.postgresHost" . }}:{{ include "echophase.postgresPort" . }}..."
          until pg_isready -h {{ include "echophase.postgresHost" . | quote }} -p {{ include "echophase.postgresPort" . | quote }} -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
            echo "Postgres not ready, sleeping..."
            sleep 3
          done
          echo "Postgres is ready!"
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: {{ include "echophase.fullname" . }}-secrets
              key: POSTGRES_USER
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: {{ include "echophase.fullname" . }}-secrets
              key: POSTGRES_DB
      - name: wait-for-scylla
        image: cassandra:4
        command: ['sh', '-c']
        # Any contact point answering will do; with a username set (an external
        # cluster with authentication), cqlsh signs in.
        args:
        - |
          echo "Waiting for scylla at {{ include "echophase.scyllaContactPoints" . }}..."
          auth=""
          if [ -n "$SCYLLA_USERNAME" ]; then auth="-u $SCYLLA_USERNAME -p $SCYLLA_PASSWORD"; fi
          until for host in $(echo {{ include "echophase.scyllaContactPoints" . | quote }} | tr ',' ' '); do
              cqlsh $auth "$host" {{ include "echophase.scyllaPort" . }} -e "SELECT now() FROM system.local" > /dev/null && break
            done; do
            echo "Scylla not ready, sleeping..."
            sleep 3
          done
          echo "Scylla is ready!"
        env:
        - name: SCYLLA_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "echophase.fullname" . }}-secrets
              key: SCYLLA_USERNAME
        - name: SCYLLA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "echophase.fullname" . }}-secrets
              key: SCYLLA_PASSWORD
      - name: wait-for-valkey
        image: redis:alpine
        command: ['sh', '-c']
        # Signed in (REDISCLI_AUTH), so a PONG means usable, not just listening.
        args:
        - |
          echo "Waiting for valkey at {{ include "echophase.valkeyHost" . }}:{{ include "echophase.valkeyPort" . }}..."
          until redis-cli -h {{ include "echophase.valkeyHost" . | quote }} -p {{ include "echophase.valkeyPort" . | quote }}{{ if eq (include "echophase.valkeySsl" .) "true" }} --tls{{ end }} ping | grep -q PONG; do
            echo "Valkey not ready, sleeping..."
            sleep 3
          done
          echo "Valkey is ready!"
        env:
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: {{ include "echophase.fullname" . }}-secrets
              key: VALKEY_PASSWORD
      {{- if .Values.s3.enabled }}
      # The release's SeaweedFS: wait for its S3 gateway, then create the
      # bucket (signed with the server's keys; "already yours" is fine). An
      # external S3 is not waited for; its bucket is the user's to create.
      - name: wait-for-s3
        image: "{{ .Values.s3.image.repository }}:{{ .Values.s3.image.tag }}"
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for S3 at $S3_ENDPOINT..."
          until curl -fsS "$S3_ENDPOINT/healthz" > /dev/null; do
            echo "S3 not ready, sleeping..."
            sleep 3
          done
          status=$(curl -sS -o /tmp/answer -w '%{http_code}' -X PUT \
            --aws-sigv4 "aws:amz:$S3_REGION:s3" --user "$S3_ACCESS_KEY_ID:$S3_SECRET_ACCESS_KEY" \
            "$S3_ENDPOINT/$S3_BUCKET")
          case "$status" in
            200) echo "Bucket $S3_BUCKET created." ;;
            409) echo "Bucket $S3_BUCKET exists." ;;
            *) echo "Creating bucket $S3_BUCKET failed ($status):"; cat /tmp/answer; exit 1 ;;
          esac
        envFrom:
        - configMapRef:
            name: {{ include "echophase.fullname" . }}-config
        - secretRef:
            name: {{ include "echophase.fullname" . }}-secrets
      {{- end }}
      {{- if .Values.migrate.enabled }}
      - name: migrate
        image: {{ include "echophase.image" (list $ .Values.migrate.image) | quote }}
        imagePullPolicy: {{ include "echophase.appImagePullPolicy" (list $ .Values.migrate.image) }}
        args: ["migrate"]
        envFrom:
        - configMapRef:
            name: {{ include "echophase.fullname" . }}-config
        - secretRef:
            name: {{ include "echophase.fullname" . }}-secrets
        {{- if include "echophase.postgresCa" . }}
        volumeMounts:
        - name: postgres-ca
          mountPath: /etc/echophase/postgres-ca
          readOnly: true
        {{- end }}
        resources:
          {{- toYaml .Values.migrate.resources | nindent 10 }}
      {{- end }}
      containers:
      - name: server
        image: {{ include "echophase.image" (list $ .Values.echophase.image) | quote }}
        imagePullPolicy: {{ include "echophase.appImagePullPolicy" (list $ .Values.echophase.image) }}
        # Keep serving while the pod is taken out of the Service's endpoints;
        # without the pause, requests routed to it in that window time out.
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        ports:
        - containerPort: {{ .Values.echophase.service.targetPort }}
          name: http
        envFrom:
        - configMapRef:
            name: {{ include "echophase.fullname" . }}-config
        - secretRef:
            name: {{ include "echophase.fullname" . }}-secrets
        {{- if or .Values.echophase.logs.enabled (include "echophase.postgresCa" .) }}
        volumeMounts:
        {{- if .Values.echophase.logs.enabled }}
        - name: logs
          mountPath: /app/Logs
        {{- end }}
        {{- if include "echophase.postgresCa" . }}
        - name: postgres-ca
          mountPath: /etc/echophase/postgres-ca
          readOnly: true
        {{- end }}
        {{- end }}
        {{- if .Values.echophase.healthcheck.enabled }}
        livenessProbe:
          httpGet:
            path: {{ .Values.echophase.healthcheck.path }}
            port: http
          initialDelaySeconds: {{ .Values.echophase.healthcheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.echophase.healthcheck.periodSeconds }}
          timeoutSeconds: {{ .Values.echophase.healthcheck.timeoutSeconds }}
          failureThreshold: {{ .Values.echophase.healthcheck.failureThreshold }}
        readinessProbe:
          httpGet:
            # Ready only after warm-up (keys, EF model, connections, JIT).
            path: {{ .Values.echophase.healthcheck.readinessPath }}
            port: http
          initialDelaySeconds: {{ .Values.echophase.healthcheck.initialDelaySeconds }}
          periodSeconds: {{ .Values.echophase.healthcheck.periodSeconds }}
          timeoutSeconds: {{ .Values.echophase.healthcheck.timeoutSeconds }}
          failureThreshold: {{ .Values.echophase.healthcheck.failureThreshold }}
        {{- end }}
        resources:
          {{- toYaml .Values.echophase.resources | nindent 10 }}
      {{- if or .Values.echophase.logs.enabled (include "echophase.postgresCa" .) }}
      volumes:
      {{- if .Values.echophase.logs.enabled }}
      - name: logs
        persistentVolumeClaim:
          claimName: {{ include "echophase.fullname" . }}-logs-pvc
      {{- end }}
      {{- if include "echophase.postgresCa" . }}
      - name: postgres-ca
        secret:
          secretName: {{ .Values.postgres.external.caCertificate.secretName }}
          items:
          - key: {{ .Values.postgres.external.caCertificate.key }}
            path: {{ .Values.postgres.external.caCertificate.key }}
      {{- end }}
      {{- end }}
