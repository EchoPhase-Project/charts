apiVersion: v1
kind: Secret
metadata:
  name: {{ include "echophase.fullname" . }}-secrets
  labels:
    {{- include "echophase.labels" . | nindent 4 }}
type: Opaque
stringData:
  # PostgreSQL
  POSTGRES_HOST: {{ include "echophase.postgresHost" . | quote }}
  POSTGRES_PORT: {{ include "echophase.postgresPort" . | quote }}
  POSTGRES_USER: {{ .Values.secrets.POSTGRES_USER | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.POSTGRES_PASSWORD is required (see charts/echophase/secrets.example.yaml)" .Values.secrets.POSTGRES_PASSWORD | quote }}
  POSTGRES_DB: {{ .Values.secrets.POSTGRES_DB | quote }}
  
  # Valkey
  VALKEY_HOST: {{ include "echophase.valkeyHost" . | quote }}
  VALKEY_PORT: {{ include "echophase.valkeyPort" . | quote }}
  VALKEY_PASSWORD: {{ required "secrets.VALKEY_PASSWORD is required (see charts/echophase/secrets.example.yaml)" .Values.secrets.VALKEY_PASSWORD | quote }}
  
  # ScyllaDB
  SCYLLA_CLUSTER_NAME: {{ .Values.scylla.clusterName | quote }}
  SCYLLA_CONTACT_POINT: {{ include "echophase.scyllaContactPoints" . | quote }}
  SCYLLA_SEEDS: {{ printf "%s-scylla" (include "echophase.fullname" .) | quote }}
  SCYLLA_AUTO_BOOTSTRAP: {{ .Values.scylla.autoBootstrap | quote }}
  SCYLLA_USERNAME: {{ .Values.secrets.SCYLLA_USERNAME | quote }}
  SCYLLA_PASSWORD: {{ .Values.secrets.SCYLLA_PASSWORD | quote }}
  SCYLLA_KEYSPACE: {{ .Values.scylla.keyspace | quote }}
  {{- if include "echophase.s3" . }}

  # Object storage (S3)
  S3_ACCESS_KEY_ID: {{ required "secrets.S3_ACCESS_KEY_ID is required with S3 (see charts/echophase/secrets.example.yaml)" .Values.secrets.S3_ACCESS_KEY_ID | quote }}
  S3_SECRET_ACCESS_KEY: {{ required "secrets.S3_SECRET_ACCESS_KEY is required with S3 (see charts/echophase/secrets.example.yaml)" .Values.secrets.S3_SECRET_ACCESS_KEY | quote }}
  {{- end }}
