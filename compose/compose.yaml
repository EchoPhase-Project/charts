# EchoPhase with Docker Compose: server, webapp, Postgres, ScyllaDB, Valkey,
# and optionally SeaweedFS for object storage (S3, the "s3" profile).
#
#   cp .env.example .env     # set the passwords
#   docker compose up -d     # then http://localhost:8080
#
# The same images and settings as the Helm chart. Only the webapp is published,
# on 127.0.0.1 (set WEBAPP_PORT / WEBAPP_BIND to change); it proxies /api
# (the realtime gateway included) to the server.
name: echophase

x-server-env: &server-env
  ASPNETCORE_ENVIRONMENT: Production
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-echophase}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-echophase}
  VALKEY_HOST: valkey
  VALKEY_PORT: "6379"
  VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
  SCYLLA_CLUSTER_NAME: echophase
  SCYLLA_CONTACT_POINT: scylla
  SCYLLA_SEEDS: scylla
  SCYLLA_AUTO_BOOTSTRAP: "1"
  SCYLLA_KEYSPACE: echophase
  SCYLLA_AUTO_CREATE_KEYSPACE: "true"
  SCYLLA_USERNAME: ""
  SCYLLA_PASSWORD: ""
  # Object storage: empty S3_ENDPOINT, none (see .env.example).
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-echophase}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echophase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-echophase}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:latest
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}", "--appendonly", "yes"]
    volumes:
      - valkey:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"${VALKEY_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  scylla:
    image: scylladb/scylla:latest
    restart: unless-stopped
    command: ["--cluster-name=echophase", "--smp=1", "--memory=${SCYLLA_MEMORY:-1G}", "--overprovisioned=1", "--developer-mode=1"]
    volumes:
      - scylla:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # Object storage (profile "s3"): SeaweedFS with one S3 identity, the
  # server's keys. Its S3 gateway is http://s3:8333 for the server.
  s3:
    image: chrislusf/seaweedfs:4.48
    profiles: [s3]
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    entrypoint: ["sh", "-c"]
    command:
      - |
        : "$${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}" "$${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}"
        mkdir -p /etc/seaweedfs
        printf '{"identities":[{"name":"echophase","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /etc/seaweedfs/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json \
          -s3.port.iceberg=0 -s3.port.lance=0 -master.volumeSizeLimitMB=1024 -volume.max=0
    volumes:
      - s3:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Creates the server's bucket in SeaweedFS (once; "already yours" is fine).
  s3-bucket:
    image: chrislusf/seaweedfs:4.48
    profiles: [s3]
    environment: *server-env
    entrypoint: ["sh", "-c"]
    command:
      - |
        status=$$(curl -sS -o /tmp/answer -w '%{http_code}' -X PUT \
          --aws-sigv4 "aws:amz:$$S3_REGION:s3" --user "$$S3_ACCESS_KEY_ID:$$S3_SECRET_ACCESS_KEY" \
          "$$S3_ENDPOINT/$$S3_BUCKET")
        case "$$status" in
          200) echo "Bucket $$S3_BUCKET created." ;;
          409) echo "Bucket $$S3_BUCKET exists." ;;
          *) echo "Creating bucket $$S3_BUCKET failed ($$status):"; cat /tmp/answer; exit 1 ;;
        esac
    depends_on:
      s3: { condition: service_healthy }

  # EF migrations, then exits; the server starts after it succeeded.
  migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io/echophase-project}/${SERVER_REPOSITORY:-server}:${ECHOPHASE_VERSION:-0.3.0}
    command: ["migrate"]
    environment: *server-env
    depends_on:
      postgres: { condition: service_healthy }
      scylla: { condition: service_healthy }
      valkey: { condition: service_healthy }

  server:
    image: ${IMAGE_REGISTRY:-ghcr.io/echophase-project}/${SERVER_REPOSITORY:-server}:${ECHOPHASE_VERSION:-0.3.0}
    restart: unless-stopped
    environment: *server-env
    volumes:
      - server-logs:/app/Logs
    depends_on:
      migrate: { condition: service_completed_successfully }
      # Only with the "s3" profile.
      s3-bucket: { condition: service_completed_successfully, required: false }

  webapp:
    image: ${IMAGE_REGISTRY:-ghcr.io/echophase-project}/${WEBAPP_REPOSITORY:-webapp}:${ECHOPHASE_VERSION:-0.3.0}
    restart: unless-stopped
    environment:
      API_UPSTREAM: server:8080
    ports:
      - "${WEBAPP_BIND:-127.0.0.1}:${WEBAPP_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  postgres:
  valkey:
  scylla:
  s3:
  server-logs:
