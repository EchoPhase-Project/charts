# The passwords, as Helm values in a Secret (helmrelease.yaml reads it with
# valuesFrom). Never commit it as is: encrypt it first, for example with SOPS
# (see README.md), and commit the encrypted file instead.
apiVersion: v1
kind: Secret
metadata:
  name: echophase-secret-values
  namespace: echophase
type: Opaque
stringData:
  values.yaml: |
    secrets:
      POSTGRES_PASSWORD: CHANGE_ME
      VALKEY_PASSWORD: CHANGE_ME
