# Goes in your Flux cluster directory (e.g. clusters/<cluster>/echophase.yaml):
# it tells Flux to apply this folder of your repository, decrypting SOPS files
# with the age key in Secret flux-system/sops-age.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: echophase
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/echophase
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
